name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are the required status checks on main; rename them only together
  # with the branch protection settings.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: amethyst
          POSTGRES_PASSWORD: amethyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amethyst"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      AMETHYST_TEST_DATABASE_URL: postgres://amethyst:amethyst@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Generated code (OpenAPI → Go and TypeScript, SQL → Go) must match its
  # sources. Fails when someone edits a contract or query without running
  # `make generate`, or edits generated code by hand.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make generate
      - name: Generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated code differs from the committed version. Run 'make generate' and commit:"
            git status --porcelain
            git diff
            exit 1
          fi

  # Builds the production image and runs two independent servers from it.
  # Not yet a required check; it becomes required when federation work
  # starts (Milestone 4).
  federation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke
